# The checks on every pull request, and on staging and main after a merge: Rust's tests, every npm package's
# tests and the playground's, and Android's Kotlin; and on a pull request into main, and on staging after
# a merge, the release's dry run. Main's ruleset (.github/rulesets/main.json) requires the job named
# "Types, tests and conformance" (its name is the ruleset's), which passes only when the ones before it do;
# the TypeScript builds are the type checks. The release runs these same checks (release.yml calls this
# workflow).
#
# A tree (the exact files, this workflow's own included) is tested once: a run that passes leaves a small
# artifact named after the tree's hash (tested-<tree>, and dryrun-<tree> for the release dry run's
# packaging), and a later run on the same tree, after a merge into staging or main, on the pull request
# into main, or in the release, finds it and skips that work. Only a run of this repository counts, not a
# fork's. The release dry run's registry check always runs: a registry can change while the files don't.
name: Extended Mark

on:
  pull_request:
  push:
    branches: [staging, main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  # to find a tested tree's artifact (tested-<tree>)
  actions: read

concurrency:
  # the workflow's name too: called by the release, these checks don't cancel main's own run
  group: ${{ github.workflow }}-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  ZIGLANG: "0.17.1"
  # a registry that stops answering for a while fails a download, and the run with it: cargo and
  # npm try again more often, and wait longer, before they give up
  CARGO_NET_RETRY: "10"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"

jobs:
  gate:
    name: Already tested?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tree: ${{ steps.find.outputs.tree }}
      tested: ${{ steps.find.outputs.tested }}
      dryrun: ${{ steps.find.outputs.dryrun }}
      wants-dryrun: ${{ steps.find.outputs.wants-dryrun }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_ID: ${{ github.event.repository.id }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          # an unexpired artifact by this name, left by a run of this repository (not a fork's)
          found() {
            n=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$1&per_page=20" \
              --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == $REPO_ID)] | length" 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then echo true; else echo false; fi
          }
          tested=$(found "tested-$tree"); dryrun=$(found "dryrun-$tree")
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          echo "dryrun=$dryrun" >> "$GITHUB_OUTPUT"
          # the release dry run: on a pull request into main, and on staging after a merge
          wants=false
          if [ "${{ github.base_ref }}" = main ] || { [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/staging ]; }; then wants=true; fi
          echo "wants-dryrun=$wants" >> "$GITHUB_OUTPUT"
          said() { if [ "$1" = true ]; then echo "passed in an earlier run, so it is skipped"; else echo "runs"; fi; }
          echo "Tree $tree. The tests: $(said "$tested"). The release dry run's packaging: $(said "$dryrun")." >> "$GITHUB_STEP_SUMMARY"

  wasm:
    name: xtmd.wasm
    needs: gate
    # what the tests and the release dry run's packaging build with, when either still has to run
    if: needs.gate.outputs.tested != 'true' || (needs.gate.outputs.wants-dryrun == 'true' && needs.gate.outputs.dryrun != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Rust, for wasm32-wasip1
        run: rustup toolchain install stable --profile minimal --target wasm32-wasip1 && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: wasm
      - name: zig
        run: pip install "ziglang==$ZIGLANG"
      - name: Build
        run: XTMD_ZIG="python3 -m ziglang" compiler/wasm/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: checks-xtmd-wasm
          path: compiler/npm/wasm/xtmd.wasm
          if-no-files-found: error
          retention-days: 3

  rust:
    name: Rust's tests
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: tests
      - name: Tests
        working-directory: compiler
        run: cargo test --workspace --no-fail-fast

  npm:
    # on four machines at once: every one builds all the packages, and tests its own part of them
    # (tools/release/build-ts.mjs --only, --except: the last part is every package the others don't
    # name, so none is left out), or the checks that aren't a package's
    name: npm packages and the playground (${{ matrix.part }})
    needs: [gate, wasm]
    if: needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: compiler, runtime and widgets
            tests: --only compiler/npm,runtime,widgets
          - part: engines
            tests: --only engines
          - part: renderers, live and apps
            tests: --except compiler/npm,runtime,widgets,engines
          - part: notes, migrate's tools and VS Code
            tests: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # npm's downloads, kept between runs while the lock files stay the same
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: release
      - uses: actions/download-artifact@v8
        with:
          name: checks-xtmd-wasm
          path: compiler/npm/wasm
      - name: The compiler, which the packages' tests build their pages with
        working-directory: compiler
        run: cargo build --release -p xtmd
      - name: A browser for the tests that draw in one
        # every browser test reads XTMD_CHROMIUM; the runner has Chrome
        run: echo "XTMD_CHROMIUM=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Built, in order
        run: node tools/release/build-ts.mjs
      - name: Tested
        if: matrix.tests != ''
        run: node tools/release/build-ts.mjs --test-only ${{ matrix.tests }}
      - name: The notes for agents, held to the repository
        if: matrix.tests == ''
        run: |
          node --test tools/llm/test/*.test.mjs
          node tools/llm/check.mjs
      - name: The pre-commit checks, and the table of what each release removes
        if: matrix.tests == ''
        run: |
          node --test .github/pre-commit/test/*.test.mjs
          node .github/pre-commit/check.mjs
      - name: xtmd migrate's tools - the release before's front end is its tag's, and chain.py
        if: matrix.tests == ''
        # the 0.3.2 corpus itself is migrated by Rust's tests (compiler/xtmd/tests/migrate_032.rs)
        run: |
          tag=$(sed -n 's/^pub const TAG: &str = "\(.*\)";$/\1/p' compiler/xtmd/previous/mod.rs)
          git fetch --no-tags --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          node tools/release/previous.mjs --check
          python3 -m unittest discover tools/migrate/test
      - name: The VS Code extension, built and tested
        if: matrix.tests == ''
        working-directory: ide/vscode
        run: npm install --no-audit --no-fund && npm test

  android:
    name: Android's Kotlin
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: The Android SDK the project builds with
        # the runner has one, and these parts of it may be missing
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" > "$RUNNER_TEMP/sdk.log" || { tail -n 20 "$RUNNER_TEMP/sdk.log"; exit 1; }
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: android
      - name: Gradle's downloads, and Robolectric's Android, kept between runs
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: android-${{ hashFiles('**/*.gradle.kts', 'renderers/compose/gradle/**') }}
          restore-keys: |
            android-
            gradle-
      - name: The compiler, which the tests build their pages with
        working-directory: compiler
        run: cargo build --release -p xtmd
      - name: The libraries for the JVM, and the Kotlin bindings
        run: |
          runtime/kotlin/rust/build.sh host
          live/compose/rust/build.sh host
      - name: Built
        # Gradle fetches its plugins from Google, Maven Central and the Gradle Plugin Portal; when one stops
        # answering it is tried again a minute later, up to three times. Kotlin that doesn't compile isn't.
        working-directory: renderers/compose
        run: |
          set -o pipefail
          for try in 1 2 3; do
            ./gradlew --no-daemon :xtmd-android-widgets:compileDebugUnitTestKotlin :xtmd-android:compileDebugUnitTestKotlin :xtmd-android-live:compileDebugUnitTestKotlin :sample:compileDebugUnitTestKotlin 2>&1 | tee "$RUNNER_TEMP/gradle.log" && break
            why=$(grep -E "^e: " "$RUNNER_TEMP/gradle.log" | head -6 | tr '\n' ' ' | cut -c1-500)
            if [ -n "$why" ]; then echo "::error::The Kotlin doesn't compile: $why"; exit 1; fi
            why=$(tail -n 8 "$RUNNER_TEMP/gradle.log" | tr '\n' ' ' | cut -c1-500)
            if [ "$try" = 3 ]; then echo "::error::Gradle failed three times: $why"; exit 1; fi
            echo "::warning::Gradle failed (try $try of 3): $why; trying again in 60 seconds"
            sleep 60
          done
      - name: Tested
        working-directory: renderers/compose
        run: |
          # Robolectric fetches its Android from Maven as a module's first test starts. When it can't, the module's
          # tests didn't start: when nothing else failed they are tried again a minute later, up to three times
          # in all. A test that ran and failed isn't run again; it and why are in the check's annotations.
          for try in 1 2 3; do
            ./gradlew --no-daemon testDebugUnitTest --continue && exit 0
            python3 ../../tools/release/android-failures.py ../.. || exit 1
            echo "::warning::Robolectric's Android couldn't be fetched (try $try of 3)"
            if [ "$try" != 3 ]; then sleep 60; fi
          done
          exit 1
      - name: Not one was skipped
        working-directory: renderers/compose
        run: |
          ran=$(find ../.. -path "*/build/test-results/testDebugUnitTest/*.xml" -exec cat {} + | grep -c "<testcase")
          skipped=$(find ../.. -path "*/build/test-results/testDebugUnitTest/*.xml" -exec cat {} + | grep -c "<skipped" || true)
          echo "$ran tests, $skipped skipped"
          test "$ran" -gt 0 && test "$skipped" -eq 0

  release:
    name: Release dry run
    # would merging into main release VERSION on every registry? A release that fails on main can't be
    # taken back, so before the merge tools/release/preflight.mjs checks each registry's names,
    # versions and credentials, and each publish is dry-run. Nothing is published. The registry check
    # always runs; the packaging, which depends only on the files, once per tree.
    needs: [gate, wasm]
    if: ${{ !cancelled() && needs.gate.outputs.wants-dryrun == 'true' && (needs.wasm.result == 'success' || needs.wasm.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      PACK: ${{ needs.gate.outputs.dryrun != 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: npm 11.15 or later, for staged publishing
        run: npm install -g npm@^11.15.0
      - name: Every registry can take VERSION
        env:
          NPM_TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATES_TRUSTED: ${{ vars.CRATES_TRUSTED_PUBLISHING }}
          VSCE_TRUSTED: ${{ vars.VSCE_TRUSTED_PUBLISHING }}
          OVSX_TRUSTED: ${{ vars.OVSX_TRUSTED_PUBLISHING }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/preflight.mjs
      - name: The packaging was dry-run on this tree already
        if: env.PACK != 'true'
        run: echo "tree ${{ needs.gate.outputs.tree }} - npm, crates.io and the .vsix were dry-run already (dryrun-${{ needs.gate.outputs.tree }})"
      - name: Rust
        if: env.PACK == 'true'
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        if: env.PACK == 'true'
        with:
          workspaces: compiler
          key: release
      - uses: actions/download-artifact@v8
        if: env.PACK == 'true'
        with:
          name: checks-xtmd-wasm
          path: compiler/npm/wasm
      - name: The release tools' tests
        if: env.PACK == 'true'
        # previous.test.mjs reads the release before's tag, which a checkout doesn't fetch
        run: |
          tag=$(sed -n 's/^pub const TAG: &str = "\(.*\)";$/\1/p' compiler/xtmd/previous/mod.rs)
          git fetch --no-tags --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          node --test tools/release/test/*.test.mjs
      - name: This machine's xtmd, in its platform package
        if: env.PACK == 'true'
        run: |
          (cd compiler && cargo build --release -p xtmd)
          (cd compiler/npm/extended-mark && npm run binary)
      - name: npm, dry run
        if: env.PACK == 'true'
        run: |
          node tools/release/build-ts.mjs
          node tools/release/publish-npm.mjs --version "$(cat VERSION)" --stage --dry-run
      - name: crates.io, dry run
        if: env.PACK == 'true'
        run: tools/release/publish-crates.sh --dry-run
      - name: The VS Code extension, packed
        if: env.PACK == 'true'
        working-directory: ide/vscode
        run: npm install --no-audit --no-fund && npm run package -- -o "$RUNNER_TEMP/xtmd.vsix"
      - name: This tree's packaging passed
        if: env.PACK == 'true'
        run: echo "${{ needs.gate.outputs.tree }}" > "$RUNNER_TEMP/tree.txt"
      - uses: actions/upload-artifact@v7
        if: env.PACK == 'true'
        with:
          name: dryrun-${{ needs.gate.outputs.tree }}
          path: ${{ runner.temp }}/tree.txt
          retention-days: 30

  checks:
    # the check main's ruleset requires, by this name
    name: Types, tests and conformance
    if: always()
    needs: [gate, rust, npm, android, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every check passed
        run: |
          echo "tree ${{ needs.gate.outputs.tree }} (tested before: ${{ needs.gate.outputs.tested }}); Rust's tests: ${{ needs.rust.result }}; npm and the playground: ${{ needs.npm.result }}; Android's Kotlin: ${{ needs.android.result }}; release dry run: ${{ needs.release.result }}"
          test "${{ needs.gate.result }}" = success
          if [ "${{ needs.gate.outputs.tested }}" = true ]; then
            echo "these files passed every test in an earlier run of this repository: tested-${{ needs.gate.outputs.tree }}"
          else
            test "${{ needs.rust.result }}" = success
            test "${{ needs.npm.result }}" = success
            test "${{ needs.android.result }}" = success
          fi
          # the dry run is skipped on pull requests into staging, and runs before main
          test "${{ needs.release.result }}" = success || test "${{ needs.release.result }}" = skipped
          echo "${{ needs.gate.outputs.tree }}" > "$RUNNER_TEMP/tree.txt"
      # this tree passed: a later run on the same files (after a merge, in the release) needn't test it again
      - uses: actions/upload-artifact@v7
        if: needs.gate.outputs.tested != 'true'
        with:
          name: tested-${{ needs.gate.outputs.tree }}
          path: ${{ runner.temp }}/tree.txt
          retention-days: 30
