# The checks on every pull request, and on staging and main after a merge: Rust's tests, every npm package's
# tests and the playground's, and every target's conformance checks (xtmd target check); and on a pull
# request into main, and on staging after a merge, the release's dry run. Main's ruleset
# (.github/rulesets/main.json) requires the job named "Types, tests and conformance", which passes only
# when the ones before it do; the TypeScript builds are the type checks. The release runs these same
# checks (release.yml calls this workflow).
name: Extended Mark

on:
  pull_request:
  push:
    branches: [staging, main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # the workflow's name too: called by the release, these checks don't cancel main's own run
  group: ${{ github.workflow }}-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  ZIGLANG: "0.17.1"
  # a registry that stops answering for a while fails a download, and the run with it: cargo and
  # npm try again more often, and wait longer, before they give up
  CARGO_NET_RETRY: "10"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"

jobs:
  wasm:
    name: xtmd.wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust, for wasm32-wasip1
        run: rustup toolchain install stable --profile minimal --target wasm32-wasip1 && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: wasm
      - name: zig
        run: pip install "ziglang==$ZIGLANG"
      - name: Build
        run: XTMD_ZIG="python3 -m ziglang" compiler/wasm/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: checks-xtmd-wasm
          path: compiler/npm/wasm/xtmd.wasm
          if-no-files-found: error
          retention-days: 3

  rust:
    name: Rust's tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: tests
      - name: Tests
        working-directory: compiler
        run: cargo test --workspace --no-fail-fast

  npm:
    name: npm packages and the playground
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: release
      - uses: actions/download-artifact@v4
        with:
          name: checks-xtmd-wasm
          path: compiler/npm/wasm
      - name: The compiler, which the packages' tests build their pages with
        working-directory: compiler
        run: cargo build --release -p xtmd
      - name: A browser for the tests that draw in one
        # every browser test reads XTMD_CHROMIUM; the runner has Chrome
        run: echo "XTMD_CHROMIUM=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Built, in order
        run: node tools/release/build-ts.mjs
      - name: Tested
        run: node tools/release/build-ts.mjs --test-only
      - name: The VS Code extension, built and tested
        working-directory: ide/vscode
        run: npm install --no-audit --no-fund && npm test

  conformance:
    name: Every target's conformance checks
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: release
      - uses: actions/download-artifact@v4
        with:
          name: checks-xtmd-wasm
          path: compiler/npm/wasm
      - name: The compiler, and the native runtime's and egui's check adapters
        working-directory: compiler
        run: |
          cargo build --release -p xtmd -p xtmd-runtime -p xtmd-egui -p xtmd-egui-live --bins
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: The npm packages the web targets draw with
        run: node tools/release/build-ts.mjs
      - name: The VS Code extension's widgets, for the vscode target
        working-directory: ide/vscode
        run: npm install --no-audit --no-fund
      - name: Gradle's downloads, kept between runs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('targets/examples/misc/android/compose/**/*.gradle.kts', 'targets/examples/misc/android/compose/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: The Android libraries for the JVM, and their check adapters' classpath
        run: |
          targets/examples/misc/android/xtmd/build.sh host
          targets/examples/misc/android/xtmd-live/build.sh host
          # the adapters start as `java @build/check_adapter.args …` (targets/examples/misc/android/compose/target.yaml);
          # without the file, android's and android-live's adapters can't start.
          # Gradle fetches its plugins from Google, Maven Central and the Gradle Plugin Portal; when one
          # stops answering (as on 20 November 2026), it is tried again a minute later, up to three times
          # Gradle's own reason goes in the check's annotations, so a failure says why without its log
          cd targets/examples/misc/android/compose
          set -o pipefail
          for try in 1 2 3; do
            ./gradlew --no-daemon :xtmd-android:checkAdapterArgs 2>&1 | tee "$RUNNER_TEMP/gradle.log" && break
            why=$(grep -A4 -E "What went wrong|^e: " "$RUNNER_TEMP/gradle.log" | grep -v -E "^\* (What went wrong|Try)|^--$|^$" | head -6 | tr '\n' ' ' | cut -c1-500)
            why=${why:-$(tail -n 3 "$RUNNER_TEMP/gradle.log" | tr '\n' ' ' | cut -c1-500)}
            if [ "$try" = 3 ]; then echo "::error::Gradle failed three times: $why"; exit 1; fi
            echo "::warning::Gradle failed (try $try of 3): $why; trying again in 60 seconds"
            sleep 60
          done
      - name: A browser for the web targets
        run: echo "XTMD_CHROMIUM=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Every target, every case
        run: xtmd target check

  release:
    name: Release dry run
    # would merging into main release VERSION on every registry? A release that fails on main can't be
    # taken back, so before the merge tools/release/preflight.mjs checks each registry's names,
    # versions and credentials, and each publish is dry-run. Nothing is published.
    if: github.base_ref == 'main' || (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: release
      - uses: actions/download-artifact@v4
        with:
          name: checks-xtmd-wasm
          path: compiler/npm/wasm
      - name: The release tools' tests
        run: node --test tools/release/test/
      - name: npm 11.15 or later, for staged publishing
        run: npm install -g npm@^11.15.0
      - name: Every registry can take VERSION
        env:
          NPM_TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATES_TRUSTED: ${{ vars.CRATES_TRUSTED_PUBLISHING }}
          VSCE_TRUSTED: ${{ vars.VSCE_TRUSTED_PUBLISHING }}
          OVSX_TRUSTED: ${{ vars.OVSX_TRUSTED_PUBLISHING }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/preflight.mjs
      - name: This machine's xtmd, in its platform package
        run: |
          (cd compiler && cargo build --release -p xtmd)
          (cd compiler/npm/extended-mark && npm run binary)
      - name: npm, dry run
        run: |
          node tools/release/build-ts.mjs
          node tools/release/publish-npm.mjs --version "$(cat VERSION)" --stage --dry-run
      - name: crates.io, dry run
        run: tools/release/publish-crates.sh --dry-run
      - name: The VS Code extension, packed
        working-directory: ide/vscode
        run: npm install --no-audit --no-fund && npm run package -- -o "$RUNNER_TEMP/xtmd.vsix"

  checks:
    # the check main's ruleset requires, by this name
    name: Types, tests and conformance
    if: always()
    needs: [rust, npm, conformance, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every check passed
        run: |
          echo "Rust's tests: ${{ needs.rust.result }}; npm and the playground: ${{ needs.npm.result }}; conformance: ${{ needs.conformance.result }}; release dry run: ${{ needs.release.result }}"
          test "${{ needs.rust.result }}" = success
          test "${{ needs.npm.result }}" = success
          test "${{ needs.conformance.result }}" = success
          # the dry run is skipped on pull requests into staging, and runs before main
          test "${{ needs.release.result }}" = success || test "${{ needs.release.result }}" = skipped
