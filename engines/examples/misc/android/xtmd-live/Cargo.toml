[package]
name = "xtmd-android-live"
description = "Extended Mark's live Android engine, native side: xtmd-live's compiler (core compiled once) behind a UniFFI interface. A document's text goes in, the IR xtmd build writes comes out as JSON, and xtmd-android's XtmdDoc runs it on xtmd-android's own library. The static engine carries no compiler; this library does."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# an example engine (engines/README.md): built and checked by CI, never published
publish = false
# a member of the Rust workspace in compiler, which isn't above this folder
workspace = "../../../../../compiler"

[lib]
name = "xtmd_android_live"
# cdylib: libxtmd_android_live.so, for Android's processors and for the host's JVM (Robolectric, through JNA)
crate-type = ["cdylib", "lib"]

[dependencies]
xtmd-live = { path = "../../../../../compiler/live", version = "0.4.0" }
serde_json.workspace = true
uniffi = "=0.29.5"
