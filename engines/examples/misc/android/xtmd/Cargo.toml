[package]
name = "xtmd-android"
description = "Extended Mark's native runtime for Android: xtmd-runtime behind a UniFFI interface, from which uniffi-bindgen writes the Kotlin bindings that xtmd-android (engines/examples/misc/android/compose) draws with Compose."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# an example engine (engines/README.md): built and checked by CI, never published
publish = false
# a member of the Rust workspace in compiler, which isn't above this folder
workspace = "../../../../../compiler"

[lib]
name = "xtmd_android"
# cdylib: libxtmd_android.so, for Android's processors and for the host's JVM (Robolectric, through JNA)
crate-type = ["cdylib", "lib"]

[[bin]]
# the bindings' generator, built only with --features bindgen (README: "The Kotlin bindings")
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
xtmd-planes = { path = "../../../rust/planes", version = "0.4.0" }
xtmd-runtime = { path = "../../../rust/runtime", version = "0.4.0" }
xtmd-eval = { path = "../../../../../compiler/eval", version = "0.4.0" }
xtmd-ir = { path = "../../../../../compiler/ir", version = "0.4.0" }
serde.workspace = true
serde_json.workspace = true
uniffi = "=0.29.5"

[dev-dependencies]
xtmd-check = { path = "../../../../../compiler/check" }
xtmd-lower = { path = "../../../../../compiler/lower" }
