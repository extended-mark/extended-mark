[package]
name = "xtmd-egui"
workspace = "../../compiler"
description = "Extended Mark's desktop engine: the native runtime drawn with egui. The egui widget set, XtmdPage::new(page), and the check adapters that drive it headless through egui_kittest and AccessKit."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# built and checked by CI, never published
publish = false

[lib]
name = "xtmd_egui"

# A window showing a page: `cargo run -p xtmd-egui --example page --features app -- page.ir.json`.
[[example]]
name = "page"
required-features = ["app"]

[features]
default = ["fonts", "check"]
# egui's own fonts, which our widgets' text is drawn in (egui bundles none by default); a host
# that installs fonts of its own turns it off.
fonts = ["egui/default_fonts", "egui/monochrome_emoji_fonts"]
# The headless harness the tests drive; a host that only draws pages turns it off.
check = ["dep:egui_kittest"]
# The example's window.
app = ["dep:eframe"]

[dependencies]
xtmd-runtime = { path = "../../runtime/rust", version = "0.4.0" }
xtmd-egui-widgets = { path = "../../widgets/egui", version = "0.4.0" }
xtmd-planes = { path = "../../runtime/planes", version = "0.4.0" }
xtmd = { path = "../../compiler/xtmd", version = "0.4.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
egui = "0.37"
egui_kittest = { version = "0.37", optional = true }
eframe = { version = "0.37", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }

[dev-dependencies]
xtmd = { path = "../../compiler/xtmd", default-features = false, features = ["compiler"] }
