[package]
name = "xtmd-android"
description = "Extended Mark's native runtime for Android: xtmd-runtime behind a UniFFI interface, from which uniffi-bindgen writes the Kotlin bindings that xtmd-android (renderers/compose) draws with Compose."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# built and checked by CI, never published
publish = false
# a member of the Rust workspace in compiler, which isn't above this folder
workspace = "../../../compiler"

[lib]
name = "xtmd_android"
# cdylib: libxtmd_android.so, for Android's processors and for the host's JVM (Robolectric, through JNA)
crate-type = ["cdylib", "lib"]

[[bin]]
# the bindings' generator, built only with --features bindgen (README: "The Kotlin bindings")
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
xtmd-planes = { path = "../../planes", version = "0.4.0" }
xtmd-runtime = { path = "../../rust", version = "0.4.0" }
xtmd = { path = "../../../compiler/xtmd", version = "0.4.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
uniffi = "=0.29.5"

[dev-dependencies]
xtmd = { path = "../../../compiler/xtmd", default-features = false, features = ["compiler"] }
