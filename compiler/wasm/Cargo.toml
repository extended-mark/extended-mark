[package]
name = "xtmd-wasm"
description = "The Extended Mark compiler for the browser: what xtmd build does, on a core compiled once, for a live document; the language server, and what xtmd md and xtmd migrate do, for an editor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# shipped another way, not as a crate: xtmd.wasm, in @extended-mark/wasm and on the GitHub release
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# the language server has no disk to read: the client gives the packs
xtmd = { path = "../xtmd", version = "0.4.0", default-features = false, features = ["compiler"] }
serde_json.workspace = true
