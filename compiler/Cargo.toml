[workspace]
resolver = "2"
members = [
    "xtmd",
    "wasm",
    "schemagen",
    "../engines/examples/rust/runtime",
    "../engines/examples/rust/planes",
    "../engines/examples/rust/egui-widgets",
    "../engines/examples/rust/egui",
    "../engines/examples/rust/egui-live",
    "../engines/examples/misc/android/xtmd",
    "../engines/examples/misc/android/xtmd-live",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/extended-mark/extended-mark"


[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[profile.release]
lto = "thin"
