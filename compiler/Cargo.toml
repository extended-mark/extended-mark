[workspace]
resolver = "2"
members = [
    "xtmd",
    "wasm",
    "schemagen",
    "../runtime/rust",
    "../runtime/planes",
    "../widgets/egui",
    "../renderers/egui",
    "../live/egui",
    "../runtime/kotlin/rust",
    "../live/compose/rust",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/extended-mark/extended-mark"


[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[profile.release]
lto = "thin"
