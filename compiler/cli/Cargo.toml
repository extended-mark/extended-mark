[package]
name = "xtmd"
description = "The xtmd command: check, fmt, build and md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "xtmd"
path = "src/main.rs"

[dependencies]
xtmd-syntax = { path = "../syntax", version = "0.4.0" }
xtmd-check = { path = "../check", version = "0.4.0" }
xtmd-ir = { path = "../ir", version = "0.4.0" }
xtmd-lower = { path = "../lower", version = "0.4.0" }
xtmd-markdown = { path = "../markdown", version = "0.4.0" }
xtmd-lsp = { path = "../../ide/lsp", version = "0.4.0" }
xtmd-migrate = { path = "../migrate", version = "0.4.0" }
serde_json.workspace = true
serde.workspace = true
toml = "0.8"

[dev-dependencies]
xtmd-eval = { path = "../eval" }
jsonschema = { version = "0.61", default-features = false }
